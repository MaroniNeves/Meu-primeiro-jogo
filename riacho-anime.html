<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Forest Stream</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#27402c}
canvas{display:block;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,244,214,.07) 0%,rgba(0,0,0,0) 45%,rgba(10,28,24,.42) 100%)}
</style></head>
<body><div id="vig"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
'use strict';
const T=THREE,PI=Math.PI,TAU=PI*2;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.outputColorSpace=T.LinearSRGBColorSpace;renderer.setPixelRatio(Math.min(1.5,devicePixelRatio));
document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#3d6a38');
const camera=new T.PerspectiveCamera(40,1,.5,60);
const CAM=new T.Vector3(-.6,7.6,6.4),TGT=new T.Vector3(.3,0,-.1);
camera.position.copy(CAM);camera.lookAt(TGT);
const viewDir=TGT.clone().sub(CAM).normalize(),SUN=new T.Vector3(viewDir.x+.1,-viewDir.y+.06,viewDir.z).normalize();

/* ---------- shape of the stream (same formulas in JS and GLSL) ---------- */
const zc=x=>.9*Math.sin(x*.32)+.3*Math.sin(x*.71+1),hw=x=>2.4+.4*Math.sin(x*.5+2);
function H(x,z){const d=z-zc(x),w=hw(x),s=d/w;
 if(Math.abs(s)<1){const D=.5+.1*Math.sin(x*.9+z*1.3)+.6*Math.exp(-((x-1.8)**2)/4);return -D*Math.pow(1-s*s,1.4)+.015*Math.sin(x*5)*Math.sin(z*6)*(1-s*s);}
 const e=Math.abs(d)-w;return .75*(1-Math.exp(-e*.55))+.05*Math.sin(x*1.7+z*2.1)*Math.min(1,e);}
const mkR=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const R=mkR(7);
// rocks standing in the water: [x, z offset from the centre line, radius at the waterline]
const ROCKS=[[-4.7,.15,.75],[-1.7,-.55,.55],[1.1,.7,.9],[3.7,-.35,.6],[6.0,.55,.7]].map(([x,o,r])=>new T.Vector3(x,zc(x)+o,r));

/* ---------- shared GLSL ---------- */
const COMMON=`
uniform float uTime;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
vec2 hash2(vec2 p){return vec2(hash(p),hash(p+17.17));}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){return vnoise(p)*.55+vnoise(p*2.1+7.3)*.3+vnoise(p*4.3-3.1)*.15;}
float zc(float x){return .9*sin(x*.32)+.3*sin(x*.71+1.);}
float hw(float x){return 2.4+.4*sin(x*.5+2.);}
// sunlight through leaves: slow moving patches with a fairly crisp painted edge
float dapple(vec2 p){float n=fbm(p*.75+vec2(uTime*.03,sin(uTime*.15)*.15))*.7+vnoise(p*2.6-uTime*.05)*.3;return smoothstep(.43,.56,n);}
float caust(vec2 p,float t){vec2 q=mod(p,6.2831853)-250.;vec2 i=q;float c=1.;float inten=.005;
 for(int n=0;n<4;n++){float tt=t*(1.-(3.5/float(n+1)));i=q+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));c+=1./length(vec2(q.x/(sin(i.x+tt)/inten),q.y/(cos(i.y+tt)/inten)));}
 c/=4.;c=1.17-pow(c,1.4);return clamp(pow(abs(c),8.),0.,1.);}
`;
const U={uTime:{value:0},uLoop:{value:0},tSim:{value:null},uTexel:{value:new T.Vector2(1/384,1/256)},uRocks:{value:ROCKS},uSun:{value:SUN}};

/* ---------- ground, rocks and pebbles (one painted shader) ---------- */
const SCENE_V=`varying vec3 vW;varying vec3 vN;varying vec3 vC;
void main(){vec4 p=vec4(position,1.);vec3 n=normal;
 #ifdef USE_INSTANCING
  p=instanceMatrix*p;n=mat3(instanceMatrix)*n;
 #endif
 vC=vec3(1.);
 #ifdef USE_INSTANCING_COLOR
  vC=instanceColor;
 #endif
 vec4 w=modelMatrix*p;vW=w.xyz;vN=normalize(mat3(modelMatrix)*n);gl_Position=projectionMatrix*viewMatrix*w;}`;
const SCENE_F=COMMON+`
uniform sampler2D tSim;uniform vec2 uTexel;
varying vec3 vW;varying vec3 vN;varying vec3 vC;
vec3 pal(float h){vec3 c=vec3(.62,.58,.52);c=mix(c,vec3(.74,.62,.42),step(.22,h));c=mix(c,vec3(.6,.43,.33),step(.4,h));c=mix(c,vec3(.46,.51,.58),step(.56,h));c=mix(c,vec3(.83,.81,.74),step(.74,h));c=mix(c,vec3(.36,.35,.37),step(.9,h));return c;}
// round pebbles: voronoi cells with a dark gap, lit from one side
vec4 peb(vec2 p,float sc,float seed){vec2 g=floor(p*sc),f=fract(p*sc);float d1=9.,d2=9.;vec2 id=g,dv=vec2(0.);
 for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 o=vec2(float(i),float(j));vec2 r=o+hash2(g+o+seed)*.8+.1-f;float d=dot(r,r);if(d<d1){d2=d1;d1=d;id=g+o;dv=r;}else if(d<d2)d2=d;}
 d1=sqrt(d1);d2=sqrt(d2);vec3 c=pal(hash(id+seed*3.1));
 c*=mix(1.14,.78,smoothstep(.1,.5,d1));c+=smoothstep(.22,.0,length(dv-vec2(.13,.13)))*.1;
 return vec4(c,smoothstep(.03,.13,d2-d1));}
void main(){vec3 N=normalize(vN);vec2 p=vW.xz;vec3 col;float y=vW.y;
 #ifdef TERRAIN
  vec4 small=peb(p,9.,4.);vec3 sand=mix(vec3(.5,.44,.31),vec3(.66,.6,.44),fbm(p*1.7));
  vec3 bed=mix(sand*.8,small.rgb*.9,small.a*.8);vec4 big=peb(p,3.3,0.);bed=mix(bed*.72,big.rgb,big.a);
  float gn=fbm(p*.5+3.)+(vnoise(p*2.3)-.5)*.2;
  vec3 g=vec3(.17,.46,.27);g=mix(g,vec3(.27,.58,.25),smoothstep(.39,.41,gn));g=mix(g,vec3(.42,.69,.26),smoothstep(.5,.52,gn));g=mix(g,vec3(.6,.79,.32),smoothstep(.62,.64,gn));
  vec3 earth=vec3(.4,.34,.22)*(.82+.36*vnoise(p*6.));earth=mix(earth,vec3(.24,.4,.17),smoothstep(.45,.7,fbm(p*2.2+9.)));
  col=mix(bed,earth,smoothstep(-.02,.07,y+(vnoise(p*4.)-.5)*.05));
  col=mix(col,g,smoothstep(.06,.2,y+(vnoise(p*3.)-.5)*.1));
  col*=.93+.14*vnoise(vec2(p.x*1.5+p.y*.5,p.y*6.));
 #else
  float d=dot(N,normalize(vec3(-.45,.8,.4)))*.5+.5;float band=smoothstep(.38,.42,d)*.5+smoothstep(.68,.72,d)*.5;
  #ifdef ROCK
   float n=fbm(vW.xy*1.3+vW.z*1.1);vec3 base=mix(vec3(.36,.39,.45),vec3(.57,.59,.6),smoothstep(.42,.58,n));
   base*=.92+.16*vnoise(vec2(vW.x*2.+vW.z*3.,vW.y*9.));
   col=mix(base*vec3(.5,.56,.72),base*1.1,band);
   float moss=smoothstep(.55,.85,N.y+fbm(p*2.5)*.7-.35)*smoothstep(.03,.14,y);
   vec3 mc=mix(vec3(.17,.4,.15),vec3(.5,.7,.22),smoothstep(.42,.58,fbm(p*5.)+band*.3-.12));
   col=mix(col,mc*mix(.72,1.1,band),moss);
   col*=mix(.58,1.,smoothstep(0.,.08,y));col=mix(col,col*vec3(.7,.95,.75),smoothstep(0.,-.2,y));
  #else
   col=vC*mix(.62,1.12,band);
  #endif
 #endif
 float dp=dapple(p);col*=mix(vec3(.5,.6,.76),vec3(1.14,1.08,.94),dp);
 if(y<.02){ // under water: caustic nets (also focused by the ripple rings)
  float df=smoothstep(.02,-.15,y);vec2 suv=(p+vec2(9.,6.))/vec2(18.,12.);
  float hC=texture2D(tSim,suv).r,lap=texture2D(tSim,suv+vec2(uTexel.x,0.)).r+texture2D(tSim,suv-vec2(uTexel.x,0.)).r+texture2D(tSim,suv+vec2(0.,uTexel.y)).r+texture2D(tSim,suv-vec2(0.,uTexel.y)).r-4.*hC;
  float c=caust(p*2.3+vec2(-uTime*.22,0.)+hC*.6,uTime*.7)*.8+caust(p*4.1+5.,uTime*.9+3.)*.35;
  col+=vec3(1.,.96,.78)*c*df*(.22+.78*dp)*.6;col+=vec3(.9,1.,.95)*clamp(-lap*9.,-.15,.5)*df;}
 gl_FragColor=vec4(col,1.);}`;
const sceneMat=def=>new T.ShaderMaterial({uniforms:U,vertexShader:SCENE_V,fragmentShader:SCENE_F,defines:def});

{const SX=260,SZ=200,g=new T.PlaneGeometry(18,14,SX,SZ);g.rotateX(-PI/2);const P=g.attributes.position;
 for(let i=0;i<P.count;i++)P.setY(i,H(P.getX(i),P.getZ(i)));g.computeVertexNormals();scene.add(new T.Mesh(g,sceneMat({TERRAIN:''})));}
function rockGeo(seed){const g=new T.IcosahedronGeometry(1,4),P=g.attributes.position,a=seed*1.7;
 for(let i=0;i<P.count;i++){const x=P.getX(i),y=P.getY(i),z=P.getZ(i);
  const n=Math.sin(x*2.3+a)*Math.cos(y*2.1-a)*.5+Math.sin(z*2.7+x*1.3+a*2)*.35+Math.sin(x*5.1+z*4.3+y*3.7+a)*.15;
  const f=1+n*.22;P.setXYZ(i,x*f,y*f*(y>0?.95:1),z*f);}
 g.computeVertexNormals();return g;}
const rockMat=sceneMat({ROCK:''}),bankRocks=[];
ROCKS.forEach((r,i)=>{const m=new T.Mesh(rockGeo(i+1),rockMat);m.scale.set(r.z*1.08,r.z*.8,r.z*1.02);m.position.set(r.x,r.z*.1,r.y);m.rotation.y=i*1.3;scene.add(m);});
for(let i=0;i<9;i++){const x=-8+R()*16,side=i%2?1:-1,z=zc(x)+side*(hw(x)+.25+R()*1.9),s=.3+R()*.45;
 const m=new T.Mesh(rockGeo(20+i),rockMat);m.scale.set(s*1.15,s*.7,s);m.position.set(x,H(x,z)+s*.12,z);m.rotation.y=R()*6;scene.add(m);bankRocks.push([x,z,s*1.15]);}
const inRock=(x,z,pad)=>ROCKS.some(r=>Math.hypot(x-r.x,z-r.y)<r.z+pad)||bankRocks.some(r=>Math.hypot(x-r[0],z-r[1])<r[2]+pad*.5);
{const N=320,im=new T.InstancedMesh(new T.SphereGeometry(1,12,9),sceneMat({}),N),M=new T.Matrix4(),q=new T.Quaternion(),c=new T.Color();
 const cols=['#9e958a','#bd9f6c','#996e55','#75828f','#d4cfbd','#5a595e','#a8a294'];let n=0,guard=0;
 while(n<N&&guard++<9000){const x=-8.8+R()*17.6,z=zc(x)+(R()*2-1)*hw(x)*1.02,y=H(x,z);if(y>.03||inRock(x,z,.05))continue;
  const r=.05+R()*R()*.17;q.setFromEuler(new T.Euler((R()-.5)*.4,R()*6,(R()-.5)*.4));
  M.compose(new T.Vector3(x,y+r*.22,z),q,new T.Vector3(r*(1+R()*.4),r*.55,r*(.75+R()*.3)));im.setMatrixAt(n,M);
  im.setColorAt(n,c.set(cols[(R()*cols.length)|0]).multiplyScalar(.85+R()*.3));n++;}
 im.count=n;scene.add(im);}

/* ---------- long grass (instanced blades, seamless 8 s sway) ---------- */
const SWAY=`uniform float uLoop;float sway(float ph,vec2 p){return sin(uLoop+ph+p.x*.7)*.6+sin(uLoop*2.+ph*1.3+p.y)*.3+sin(uLoop*3.+ph*2.1)*.1;}`;
{const N=15000,base=new T.PlaneGeometry(1,1,1,5);base.translate(0,.5,0);
 const g=new T.InstancedBufferGeometry();g.index=base.index;g.setAttribute('position',base.attributes.position);g.setAttribute('uv',base.attributes.uv);
 const A=new Float32Array(N*3),B=new Float32Array(N*4);let n=0,guard=0;
 while(n<N&&guard++<N*8){const x=-9+R()*18,z=-7+R()*14,y=H(x,z);if(y<.035||inRock(x,z,-.05))continue;
  const edge=Math.abs(z-zc(x))-hw(x);if(R()>Math.exp(-edge*.55)*.9+.22)continue;
  const tall=Math.exp(-edge*.9);A.set([x,y-.02,z],n*3);B.set([R()*TAU,(.14+R()*.16)+tall*(.12+R()*.34),R()*TAU,R()],n*4);n++;}
 g.setAttribute('iPos',new T.InstancedBufferAttribute(A,3));g.setAttribute('iDat',new T.InstancedBufferAttribute(B,4));g.instanceCount=n;
 const m=new T.Mesh(g,new T.ShaderMaterial({uniforms:U,side:T.DoubleSide,vertexShader:SWAY+`attribute vec3 iPos;attribute vec4 iDat;varying float vT;varying vec2 vP;varying float vTone;
  void main(){float t=uv.y,h=iDat.y;float w=(.022+h*.035)*(1.-t*t*.92);vec3 l=vec3(position.x*w,t*h,t*t*h*.38);
   float c=cos(iDat.x),s=sin(iDat.x);vec3 p=vec3(l.x*c+l.z*s,l.y,-l.x*s+l.z*c);
   float sw=sway(iDat.z,iPos.xz)*t*t*h*.22;p.x+=sw;p.z+=sw*.35;p.y-=abs(sw)*.25;
   vT=t;vP=iPos.xz;vTone=iDat.w;gl_Position=projectionMatrix*viewMatrix*vec4(iPos+p,1.);}`,
  fragmentShader:COMMON+`varying float vT;varying vec2 vP;varying float vTone;
  void main(){vec3 a=mix(vec3(.1,.34,.2),vec3(.16,.42,.18),vTone),b=mix(vec3(.45,.72,.26),vec3(.72,.86,.36),vTone);
   vec3 col=mix(a,b,smoothstep(.1,.95,vT));col=mix(col,b*1.08,step(.8,vT)*.35);
   col*=mix(vec3(.5,.62,.76),vec3(1.14,1.08,.92),dapple(vP));gl_FragColor=vec4(col,1.);}`}));
 m.frustumCulled=false;scene.add(m);}

/* ---------- ferns (rosettes of arching fronds) ---------- */
{const c=document.createElement('canvas');c.width=128;c.height=256;const x=c.getContext('2d');x.translate(64,0);
 x.strokeStyle='#d9d9d9';x.lineWidth=4;x.beginPath();x.moveTo(0,254);x.lineTo(0,8);x.stroke();
 for(let i=0;i<19;i++){const t=i/18,y=246-t*232,L=(8+52*Math.sin(Math.min(1,t*1.15+.12)*PI)**.8)*(1-t*.25);
  for(const s of[-1,1]){x.save();x.translate(0,y);x.rotate(s*(-1.1+t*.25)+PI/2*0);x.scale(s,1);x.fillStyle=i%2?'#f2f2f2':'#c9c9c9';x.beginPath();x.moveTo(0,3);x.quadraticCurveTo(L*.5,-9,L,-L*.5-2);x.quadraticCurveTo(L*.45,6,0,5);x.fill();x.restore();}}
 const tex=new T.CanvasTexture(c);tex.anisotropy=4;
 const g=new T.PlaneGeometry(.42,1,2,9),P=g.attributes.position;
 for(let i=0;i<P.count;i++){const t=P.getY(i)+.5,xx=P.getX(i);P.setXYZ(i,xx,Math.sin(t*2.25)*.5-Math.abs(xx)*.25,t*.95);}
 const N=64*7,im=new T.InstancedMesh(g,new T.ShaderMaterial({uniforms:Object.assign({uMap:{value:tex}},U),side:T.DoubleSide,
  vertexShader:SWAY+`varying vec2 vUv;varying vec3 vC;varying vec2 vP;void main(){vUv=uv;vC=instanceColor;vec4 w=modelMatrix*instanceMatrix*vec4(position,1.);vec2 o=(modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.)).xz;
   float sw=sway(o.x*3.+o.y*2.,o)*uv.y*uv.y*.07;w.x+=sw;w.y+=sw*.5;vP=w.xz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:COMMON+`uniform sampler2D uMap;varying vec2 vUv;varying vec3 vC;varying vec2 vP;void main(){vec4 t=texture2D(uMap,vUv);if(t.a<.5)discard;
   vec3 col=vC*(.55+.6*t.r)*mix(.8,1.12,vUv.y);col*=mix(vec3(.5,.62,.76),vec3(1.14,1.08,.92),dapple(vP));gl_FragColor=vec4(col,1.);}`}),N);
 const M=new T.Matrix4(),q=new T.Quaternion(),col=new T.Color();let n=0,guard=0;
 while(n<N&&guard++<4000){const x=-8.8+R()*17.6,side=R()<.5?1:-1,z=zc(x)+side*(hw(x)+.12+R()*R()*2.6),y=H(x,z);if(y<.03||inRock(x,z,.1)||Math.abs(z)>6.6)continue;
  const s=.45+R()*.5,a0=R()*6,k=7;for(let f=0;f<k;f++){q.setFromEuler(new T.Euler(-.25-R()*.35,a0+f/k*TAU+R()*.3,0,'YXZ'));
   M.compose(new T.Vector3(x,y+.02,z),q,new T.Vector3(s,s,s*(.85+R()*.3)));im.setMatrixAt(n,M);im.setColorAt(n,col.setHSL(.29+R()*.07,.55,.3+R()*.14));n++;}}
 im.count=n;scene.add(im);}

/* ---------- ripple simulation (height field, wave equation, ping-pong) ---------- */
const simOpt={type:T.HalfFloatType,format:T.RGBAFormat,minFilter:T.LinearFilter,magFilter:T.LinearFilter,depthBuffer:false};
let simA=new T.WebGLRenderTarget(384,256,simOpt),simB=new T.WebGLRenderTarget(384,256,simOpt);
const simU={tPrev:{value:null},uTexel:U.uTexel,uDrop:{value:new T.Vector3(.5,.5,0)},uRocks:U.uRocks,uTime:U.uTime};
const simScene=new T.Scene(),simCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
const simMat=new T.ShaderMaterial({uniforms:simU,vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
 fragmentShader:COMMON+`uniform sampler2D tPrev;uniform vec2 uTexel;uniform vec3 uDrop;uniform vec3 uRocks[5];varying vec2 vUv;
 void main(){vec4 c=texture2D(tPrev,vUv);
  float s=texture2D(tPrev,vUv+vec2(uTexel.x,0.)).r+texture2D(tPrev,vUv-vec2(uTexel.x,0.)).r+texture2D(tPrev,vUv+vec2(0.,uTexel.y)).r+texture2D(tPrev,vUv-vec2(0.,uTexel.y)).r;
  float nw=(2.*c.r-c.g+.07*(s-4.*c.r))*.99;                       // r = height now, g = height one step ago
  vec2 d=(vUv-uDrop.xy)*vec2(18.,12.);nw-=uDrop.z*exp(-dot(d,d)/.011); // the butterfly touching the surface
  vec2 p=vUv*vec2(18.,12.)-vec2(9.,6.);float m=smoothstep(1.,.9,abs((p.y-zc(p.x))/hw(p.x)));   // banks and rocks stop the waves
  for(int i=0;i<5;i++)m*=smoothstep(uRocks[i].z*.95,uRocks[i].z*1.12,length(p-uRocks[i].xy));
  gl_FragColor=vec4(nw*m,c.r*m,0.,1.);}`});simScene.add(new T.Mesh(new T.PlaneGeometry(2,2),simMat));
function simStep(){simU.tPrev.value=simA.texture;simMat.uniformsNeedUpdate=true;renderer.setRenderTarget(simB);renderer.render(simScene,simCam);const t=simA;simA=simB;simB=t;simU.uDrop.value.z=0;U.tSim.value=simA.texture;}
function drop(x,z,s){simU.uDrop.value.set((x+9)/18,(z+6)/12,s);}

/* ---------- water surface ---------- */
const rt=new T.WebGLRenderTarget(4,4,{minFilter:T.LinearFilter,magFilter:T.LinearFilter});rt.depthTexture=new T.DepthTexture(4,4);rt.depthTexture.type=T.UnsignedIntType;
const WU=Object.assign({tScene:{value:rt.texture},tDepth:{value:rt.depthTexture},uRes:{value:new T.Vector2()},uNear:{value:camera.near},uFar:{value:camera.far}},U);
const water=new T.Mesh(new T.PlaneGeometry(18,14).rotateX(-PI/2),new T.ShaderMaterial({uniforms:WU,depthWrite:false,
 vertexShader:'varying vec3 vW;varying vec3 vV;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vec4 v=viewMatrix*w;vV=v.xyz;gl_Position=projectionMatrix*v;}',
 fragmentShader:COMMON+`
 uniform sampler2D tScene,tDepth,tSim;uniform vec2 uRes,uTexel;uniform float uNear,uFar;uniform vec3 uRocks[5];uniform vec3 uSun;
 varying vec3 vW;varying vec3 vV;
 float linZ(float d){float z=d*2.-1.;return 2.*uNear*uFar/(uFar+uNear-z*(uFar-uNear));}
 // flow: follows the bends, slower at the banks, and parts around each rock (potential flow round a cylinder)
 vec2 baseDir(float x){return normalize(vec2(1.,.288*cos(x*.32)+.213*cos(x*.71+1.)));}
 vec2 flow(vec2 p){float s=(p.y-zc(p.x))/hw(p.x);vec2 Uv=baseDir(p.x)*mix(1.,.22,smoothstep(.15,1.,abs(s)));vec2 v=Uv;
  for(int i=0;i<5;i++){vec2 d=p-uRocks[i].xy;float R2=uRocks[i].z*uRocks[i].z,l2=dot(d,d);vec2 dh=d*inversesqrt(max(l2,1e-4));v-=(R2/max(l2,R2))*(2.*dot(Uv,dh)*dh-Uv);}
  return v;}
 float wave(vec2 q){return vnoise(q*2.6+vec2(0.,uTime*.12))*.55+vnoise(q*6.3-vec2(uTime*.2,0.))*.3+vnoise(q*14.)*.15;}
 // sky and leaf canopy seen in the reflection
 vec3 env(vec3 r){float y=max(r.y,.03);vec2 q=r.xz/y;vec3 sky=mix(vec3(1.,.98,.88),vec3(.5,.76,.98),smoothstep(0.,.75,r.y));
  float n=fbm(q*1.1+vec2(uTime*.015,0.));float leaf=smoothstep(.44,.5,n);
