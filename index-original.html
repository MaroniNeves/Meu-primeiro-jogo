function listRender(){list.replaceChildren();const txt=search.value.trim().toLowerCase();const rows=ABILITIES.filter(a=>(filter.value==='all'||(filter.value==='featured'?FEATURED.includes(a.id):a.school===filter.value))&&(!txt||((a.label+' '+a.id+' '+a.school+' '+SCHOOL[a.school]).toLowerCase().includes(txt))));count.textContent=rows.length+' magias visíveis';for(const a of rows){const btn=make('button',{class:'ar-item','data-id':a.id},list);const dot=make('span',{class:'ar-dot'},btn);dot.style.backgroundColor=a.accent;dot.style.color=a.accent;const txtcol=make('span',{},btn);make('b',{text:a.label},txtcol);make('small',{text:(SCHOOL[a.school]||a.school)+' · '+(a.cast==='ZONE'?'Explosão em área':'Projétil / feixe')},txtcol);btn.addEventListener('click',()=>choose(a.id));}selected()}
async function choose(id){const a=ABILITIES.find(b=>b.id===id);if(!a)return;chosen=a;menuOpen(false);selected();statusText('Carregando '+a.label+'…');if(app){try{app.selectAbility(id,{silent:true});const ok=await app.abilities.warm(id);if(!ok)throw Error('Habilidade não carregada');statusText(a.label+' pronto • toque em Lançar magia');}catch(e){statusText('Erro: '+(e.message||e))}}}
async function doCast(){if(!app||loading){statusText('Carregando cena 3D…');return;}try{if(!app.abilities.isReady(chosen.id)){statusText('Preparando '+chosen.label+'…');const ok=await app.abilities.warm(chosen.id);if(!ok)throw Error('Falha carregando efeito');}if(app.aim.isArmed)app.aim.cancel();const o=app.character.position.clone();o.y=0;const d=app.camera.position.clone().sub(o);d.y=0;d.normalize();d.multiplyScalar(-1);if(d.lengthSq()<0.001)d.set(0,0,1);const c=app.aim.config;const range=c.range||12;const dist=Math.max(c.minRange||1.5,Math.min(range*0.52,8));app.aim.direction.copy(d);app.aim.yaw=Math.atan2(d.x,d.z);const result=app.abilities.cast(o,d,dist,chosen.id);if(!result){statusText('Ainda preparando efeito…');return;}app.character.setFacing(app.aim.yaw);app.character.playCast(c.castAnim||'cast1');app.character.castLunge();casts++;statusText('✦ '+chosen.label+' • magia lançada '+casts+'×');}catch(e){console.error(e);statusText('Erro ao lançar: '+(e.message||e));}}
function stopAuto(){auto=false;if(timer){clearInterval(timer);timer=null}replay.textContent='↻ Auto OFF';replay.style.background=''};
replay.addEventListener('click',()=>{if(auto){stopAuto();return;}auto=true;replay.textContent='↻ Auto ON';replay.style.background='#4c3527';doCast();timer=setInterval(()=>{if(app&&!app.paused)doCast()},3400);});cast.addEventListener('click',doCast);clearTop.addEventListener('click',()=>{stopAuto();if(app)app.clearEffects();statusText('Cena limpa')});
function wheel(n){if(!app)return;const rig=app.rig;rig._onWheel({deltaY:n,deltaMode:0,preventDefault(){}})}zoomIn.addEventListener('click',()=>wheel(-180));zoomOut.addEventListener('click',()=>wheel(180));reset.addEventListener('click',()=>{if(!app)return;for(let i=0;i<5;i++)wheel(60);app.rig.controls.reset();statusText('Câmera reenquadrada')});
filter.addEventListener('change',listRender);search.addEventListener('input',listRender);listRender();
window.addEventListener('keydown',(e)=>{if(e.key===' '&&e.target===document.body){e.preventDefault();doCast()}});
const canvas=$('#viewport');let lastPinch=0;canvas.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];lastPinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}},{passive:true});canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];const cur=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(lastPinch)wheel((lastPinch-cur)*1.8);lastPinch=cur;}},{passive:true});canvas.addEventListener('touchend',()=>{lastPinch=0},{passive:true});
const poll=setInterval(()=>{if(window.app&&window.app.abilities&&window.app.rig){clearInterval(poll);app=window.app;try{app.rig.controls.touches.ONE=0;app.rig.controls.touches.TWO=3;app.rig.controls.mouseButtons.LEFT=0;app.rig.controls.enableRotate=true;const mobile=innerWidth<800;if(mobile){app.renderer.targetPixelRatio=()=>Math.min(devicePixelRatio||1,1.2);app.renderer.handleResize();}choose(chosen.id).then(()=>{loading=false;statusText('Pronto: '+chosen.label+' • 100 magias disponíveis');});}catch(e){statusText('Erro de interface: '+(e.message||e));}return;}if(++pollCount>900){clearInterval(poll);statusText('Não foi possível iniciar a cena 3D. Use Chrome com WebGL.');}},140);let pollCount=0;
window.arcanoLab={ABILITIES,getSelected:()=>chosen,cast:doCast,select:choose,clear:()=>app?.clearEffects(),getApp:()=>app};
})();

</script>
<script>document.querySelectorAll(".arcano-hubnav [data-mode]").forEach(b=>b.addEventListener("click",()=>{let url=new URL(b.dataset.mode,location.href);if(url.pathname!==location.pathname)location.assign(url.href)}));</script></body>
