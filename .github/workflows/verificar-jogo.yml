name: Verificar Jogo 3D
on:
  push:
    branches: [main]
  public:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo e modelos
        uses: actions/checkout@v4
      - name: Conferir integridade do jogo
        run: python3 tools/validar-jogo.py
      - name: Conferir sintaxe dos scripts JavaScript
        run: |
          node --check agua-v1226.js
          node --check ecossistema-v1232.js
      - name: Testar colisão sólida da ponte e passos na água
        run: node tools/testar-ponte-agua.js
      - name: Diagnosticar orientação das malhas Quaternius
        run: node tools/inspecionar-grama.js
      - name: Testar animação da grama, vento e afastamento dos passos
        run: node tools/testar-grama-vento.js
      - name: Validar deslocamento real da grama em WebGL
        run: node tools/testar-grama-webgl.cjs
      - name: Preparar diagnóstico navegador integrado
        run: npm install --no-save playwright-core@1.56.1
      - name: Diagnóstico jogo integrado sem bloquear publicação
        continue-on-error: true
        run: node tools/testar-jogo-integrado.cjs
