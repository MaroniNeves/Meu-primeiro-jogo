name: Verificar Jogo 3D
on:
  push:
    branches: [main]
  public:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo e modelos
        uses: actions/checkout@v4
      - name: Conferir integridade do jogo
        run: python3 tools/validar-jogo.py
      - name: Conferir sintaxe dos scripts JavaScript
        run: |
          node --check agua-v1226.js
          node --check ecossistema-v1232.js
      - name: Testar colisão sólida da ponte e passos na água
        run: node tools/testar-ponte-agua.js
      - name: Diagnosticar orientação das malhas Quaternius
        run: node tools/inspecionar-grama.js
      - name: Testar animação da grama, vento e afastamento dos passos
        run: node tools/testar-grama-vento.js
      - name: Validar deslocamento real da grama em WebGL
        run: node tools/testar-grama-webgl.cjs
      - name: Testar camera e obstrucao por arvores
        run: node tools/testar-camera-arvores.js
      - name: Testar zoom estável, pinça, botões e roda do mouse
        run: node tools/testar-zoom-camera.js
      - name: Verificar biblioteca restaurada de 100 magias e seus recursos
        run: node tools/testar-magias.js
      - name: Carregar feiticeiro e animações FBX em Chrome real
        run: node tools/testar-feiticeiro-browser.cjs
      - name: Renderizar e comparar as três magias em WebGL
        run: node tools/testar-magia-webgl.cjs
      - name: Testar classes de magia originais do laboratório no navegador
        run: node tools/testar-magias-originais-browser.cjs
