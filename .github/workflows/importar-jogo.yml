name: Migrar Atelie Arcano para Meu Primeiro Jogo
on:
  push:
    paths:
      - '.github/workflows/importar-jogo.yml'
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Preparar novo repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copiar laboratorio completo com modelos binarios
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch arcano-v12-27-vento-ancoragem-reflexos \
            https://github.com/MaroniNeves/projeto.git "$RUNNER_TEMP/origem"
          ORIGEM="$RUNNER_TEMP/origem/atelie-arcano-laboratorio"
          test -f "$ORIGEM/agua.html"
          test -d "$ORIGEM/assets/quaternius"
          test -d "$ORIGEM/assets/ultimate"
          source_count=$(find "$ORIGEM" -type f | wc -l)
          echo "Arquivos de origem: $source_count"
          test "$source_count" -ge 120
          rsync -a "$ORIGEM/" "$GITHUB_WORKSPACE/"
          # Preservar o antigo index da pasta como arquivo historico;
          # a pagina principal deste NOVO repo passa a ser o laboratorio.
          mv index.html index-original.html
          cp agua.html index.html
          cat > README.md <<'README'
          # Meu Primeiro Jogo — Ateliê Arcano

          Projeto independente com floresta 3D, grama Quaternius, personagem animado,
          clima, solo, água e simulação ecológica.

          **[Abrir jogo](./index.html)** · [Versão laboratório](./agua.html)

          Para executar localmente, utilize um servidor HTTP simples na raiz do repositório
          (por exemplo `python3 -m http.server 8000`) e abra `index.html`.

          ## Origem da migração
          Os arquivos foram importados da pasta `atelie-arcano-laboratorio/` do projeto
          anterior. O novo repositório possui arquivos e histórico próprios; o jogo não
          depende de importar scripts, modelos ou texturas da pasta antiga.

          As bibliotecas, o personagem Xbot e alguns recursos opcionais podem ser
          carregados de URLs públicas de terceiros, como já acontecia na origem.
          README
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Arquivos versionados: $(git ls-files | wc -l)"
          git diff --cached --quiet || git commit -m "Importar laboratorio 3D completo como jogo independente"
          git push origin HEAD:main
