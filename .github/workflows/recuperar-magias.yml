name: Recuperar bibliotecas de magias
on:
  push:
    paths:
      - '.github/workflows/recuperar-magias.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar Meu Primeiro Jogo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Trazer bibliotecas históricas para o repositório independente
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --single-branch --branch arcano-v12-27-vento-ancoragem-reflexos \
            https://github.com/MaroniNeves/projeto.git "$RUNNER_TEMP/original"
          ORIGINAL="$RUNNER_TEMP/original"
          test -f "$ORIGINAL/atelie-arcano-anime-v8/index.html"
          test -f "$ORIGINAL/atelie-arcano-3d/index.html"
          test -f "$ORIGINAL/atelie-arcano-laboratorio/rollshade.html"
          test -f "$ORIGINAL/atelie-arcano-laboratorio/lightning.html"
          mkdir -p magias/rollshade-v2 magias/lightning-vfx
          rsync -a "$ORIGINAL/atelie-arcano-anime-v8/" magias/
          rsync -a "$ORIGINAL/atelie-arcano-rollshade-v2/preview/" magias/rollshade-v2/
          rsync -a "$ORIGINAL/atelie-arcano-lightning-vfx/preview/" magias/lightning-vfx/
          cp "$ORIGINAL/atelie-arcano-3d/index.html" magias/espadas.html
          cp "$ORIGINAL/atelie-arcano-laboratorio/rollshade.html" magias/rollshade.html
          cp "$ORIGINAL/atelie-arcano-laboratorio/lightning.html" magias/lightning.html
          cp "$ORIGINAL/atelie-arcano-laboratorio/catalogo.html" magias/catalogo.html
          python3 - <<'PY'
          from pathlib import Path
          pages={
            "magias/rollshade.html":("../atelie-arcano-rollshade-v2/preview/","./rollshade-v2/"),
            "magias/lightning.html":("../atelie-arcano-lightning-vfx/preview/","./lightning-vfx/"),
          }
          for path,(old,new) in pages.items():
              file=Path(path)
              data=file.read_text()
              assert old in data,(path,"base path ausente")
              file.write_text(data.replace(old,new),encoding="utf-8")
          catalog=Path("magias/catalogo.html")
          content=catalog.read_text()
          catalog.write_text(content.replace('href="agua.html"','href="../agua.html"'),encoding="utf-8")
          home=Path("magias/index.html")
          contents=home.read_text()
          assert "</body>" in contents
          nav='''<nav aria-label="Bibliotecas de magias e floresta" style="position:fixed;z-index:9999;left:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:5px;max-width:min(98vw,650px);font:600 12px system-ui">
          <a href="../agua.html" style="background:#172b30e8;color:#e8f7e9;border:1px solid #749d90;padding:9px;border-radius:9px">🌳 Laboratório</a>
          <a href="./espadas.html" style="background:#172b30e8;color:#e8f7e9;border:1px solid #749d90;padding:9px;border-radius:9px">⚔️ Espadas e magias</a>
          <a href="./rollshade.html" style="background:#172b30e8;color:#e8f7e9;border:1px solid #749d90;padding:9px;border-radius:9px">Rollshade</a>
          <a href="./lightning.html" style="background:#172b30e8;color:#e8f7e9;border:1px solid #749d90;padding:9px;border-radius:9px">⚡ Raios</a>
          <a href="./catalogo.html" style="background:#172b30e8;color:#e8f7e9;border:1px solid #749d90;padding:9px;border-radius:9px">Packs</a>
          </nav>'''
          home.write_text(contents.replace("</body>",nav+"</body>"),encoding="utf-8")
          PY
          # Validar todos os arquivos requisitados pelo HTML.
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=["magias/index.html","magias/rollshade.html","magias/lightning.html"]
          for name in paths:
              p=Path(name)
              html=p.read_text()
              base=re.search(r'<base\s+href="([^"]+)"',html)
              directory=(p.parent / base.group(1)) if base else p.parent
              for asset in re.findall(r'(?:src|href)="(\./(?:assets|models)/[^"]+)"',html):
                  assert (directory/asset).exists(), (name,asset)
          print("Bibliotecas V8, Rollshade, Raios e Espadas com arquivos disponíveis")
          PY
          test -f magias/models/Idle.fbx
          test -f magias/models/diffuse.png
          test -f magias/assets/index-B00Ds7Ug.js
          test -f magias/espadas.html
          test -f magias/rollshade-v2/assets/index-B6WZpQRo.js
          test -f magias/lightning-vfx/assets/index-DfEPV-QC.js
          # A rotina temporária não fica dependente do repositório antigo.
          rm -f .github/workflows/recuperar-magias.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restaura 100 magias 3D, espadas, Rollshade e raios como bibliotecas locais independentes'
          git push origin HEAD:main
