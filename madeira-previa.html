 box(g,1.3,2.2,.2,Vd,hx-1.4,1.8,hz+2.62);box(g,1.1,2.0,.1,H,hx-1.4,1.8,hz+2.7);

 {const sh=new T.Shape();sh.moveTo(-3.8,0);sh.lineTo(3.8,0);sh.lineTo(0,2.9);const e=new T.ExtrudeGeometry(sh,{depth:6,bevelEnabled:false}),U=e.attributes.uv;for(let i=0;i<U.count;i++)U.setXY(i,U.getX(i)*.3,U.getY(i)*.3);const m=new T.Mesh(e,roofMat());m.position.set(hx,3.9,hz-3);m.castShadow=m.receiveShadow=true;g.add(m);}
