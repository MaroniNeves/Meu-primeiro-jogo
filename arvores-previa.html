<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Prévia 3D das árvores</title>
<style>
html,body{margin:0;height:100%;background:#a6d4f0;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#ui>*{pointer-events:auto}
.b{font:600 13px system-ui;border:1px solid #2a4a2a55;background:#ffffffd0;color:#173017;border-radius:999px;padding:6px 12px;cursor:pointer}
.b.on{background:#2f6a3a;color:#fff}
.p{font:600 13px system-ui;background:#ffffffd0;color:#173017;border-radius:12px;padding:6px 12px;display:flex;gap:8px;align-items:center}
input[type=range]{width:140px}
#hint{position:fixed;left:10px;bottom:10px;font:12px system-ui;color:#123;background:#ffffffb0;padding:4px 10px;border-radius:8px}
</style></head>
<body>
<div id="ui"></div>
<div id="hint">Arraste: girar · Roda/pinça: zoom · Botão direito ou Shift+arrastar: mover</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="./arvores-organicas.js"></script>
<script>
const NAMES={cerejeira:'Cerejeira',carvalho:'Carvalho',pinheiro:'Pinheiro',betula:'Bétula',salgueiro:'Salgueiro',bordo:'Bordo',acacia:'Acácia'};
const HR={cerejeira:[3,10,5],carvalho:[5,16,9],pinheiro:[5,24,12],betula:[4,12,7],salgueiro:[5,13,8],bordo:[4,12,6.5],acacia:[4,12,7]};
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(2,devicePixelRatio));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#a6d4f0');sc.fog=new THREE.Fog('#a6d4f0',70,200);
sc.add(new THREE.HemisphereLight('#dff0ff','#4f6a3a',.95));
const sun=new THREE.DirectionalLight('#fff3dc',1.9);sun.position.set(-14,26,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:35,bottom:-25,near:1,far:110});sc.add(sun);
const gr=new THREE.Mesh(new THREE.CircleGeometry(160,48),new THREE.MeshStandardMaterial({color:'#5a9a40',roughness:1}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;sc.add(gr);
const cam=new THREE.PerspectiveCamera(40,1,.1,400);
const st={type:'cerejeira',all:false,h:5,seed:3,rot:true,yaw:.6,pitch:.28,dist:16,tx:0,ty:3,tz:0};
let holder=new THREE.Group();sc.add(holder);
function build(){
 sc.remove(holder);holder.traverse(o=>{if(o.geometry)o.geometry.dispose();});holder=new THREE.Group();sc.add(holder);
 if(st.all){const L=window.arcanoTrees.types,gap=11;L.forEach((t,i)=>{const g=window.arcanoTrees.make(t,{h:HR[t][2],seed:st.seed+i*131});g.position.set((i-(L.length-1)/2)*gap,0,0);holder.add(g);});
  st.tx=0;st.ty=4;st.dist=62;}
 else{const g=window.arcanoTrees.make(st.type,{h:st.h,seed:st.seed});holder.add(g);st.tx=0;st.ty=st.h*.45;st.dist=Math.max(10,st.h*2.6);}
 ui();
}
function ui(){
 const u=document.getElementById('ui');u.innerHTML='';
 const mk=(txt,on,fn)=>{const b=document.createElement('button');b.className='b'+(on?' on':'');b.textContent=txt;b.onclick=fn;u.appendChild(b);return b;};
 for(const t of window.arcanoTrees.types)mk(NAMES[t],!st.all&&st.type===t,()=>{st.all=false;st.type=t;st.h=HR[t][2];build();});
 mk('Todas lado a lado',st.all,()=>{st.all=true;build();});
 mk('Nova variação',false,()=>{st.seed=(st.seed*7+13)%9973;build();});
 mk(st.rot?'Girar: ligado':'Girar: desligado',st.rot,()=>{st.rot=!st.rot;ui();});
 if(!st.all){const p=document.createElement('div');p.className='p';const [mn,mx]=HR[st.type];p.innerHTML='Altura <input type="range" min="'+mn+'" max="'+mx+'" step="0.5" value="'+st.h+'"> <span>'+st.h+' m</span>';
  const inp=p.querySelector('input'),sp=p.querySelector('span');inp.oninput=()=>{sp.textContent=inp.value+' m';};inp.onchange=()=>{st.h=+inp.value;build();};u.appendChild(p);}
}
function size(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const el=r.domElement,P=new Map();
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});});
el.addEventListener('pointerup',e=>{P.delete(e.pointerId);});el.addEventListener('pointercancel',e=>{P.delete(e.pointerId);});
el.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(P.size===2){const a=[...P.values()],d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);p.x=e.clientX;p.y=e.clientY;const b=[...P.values()],d1=Math.hypot(b[0].x-b[1].x,b[0].y-b[1].y);st.dist=Math.max(3,Math.min(140,st.dist*d0/Math.max(1,d1)));return;}
 p.x=e.clientX;p.y=e.clientY;
 if(p.b===2||e.shiftKey){const k=st.dist*.0016,cy=Math.cos(st.yaw),sy=Math.sin(st.yaw);st.tx-=dx*cy*k;st.tz+=dx*sy*k;st.ty=Math.max(0,st.ty+dy*k);}
 else{st.yaw-=dx*.008;st.pitch=Math.max(-.1,Math.min(1.4,st.pitch+dy*.006));}});
el.addEventListener('wheel',e=>{e.preventDefault();st.dist=Math.max(3,Math.min(140,st.dist*Math.exp(e.deltaY*.001)));},{passive:false});
el.addEventListener('contextmenu',e=>e.preventDefault());
let t0=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-t0)/1000);t0=now;if(st.rot&&!P.size)st.yaw+=dt*.35;
 const cp=Math.cos(st.pitch);cam.position.set(st.tx+Math.sin(st.yaw)*cp*st.dist,st.ty+Math.sin(st.pitch)*st.dist,st.tz+Math.cos(st.yaw)*cp*st.dist);cam.lookAt(st.tx,st.ty,st.tz);r.render(sc,cam);})(t0);
build();
</script></body></html>
