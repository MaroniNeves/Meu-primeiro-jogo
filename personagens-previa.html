<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Personagens</title>
<style>
html,body{margin:0;height:100%;background:#cfe3f2;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none;max-height:46vh;overflow:auto}
#ui>*{pointer-events:auto}
.b{font:600 12px system-ui;border:1px solid #2a3a5a55;background:#ffffffd8;color:#16243a;border-radius:999px;padding:5px 10px;cursor:pointer}
.b.on{background:#2f4f8a;color:#fff}.sep{flex-basis:100%;height:0}
#hint{position:fixed;left:8px;bottom:8px;font:12px system-ui;color:#123;background:#ffffffb8;padding:4px 10px;border-radius:8px}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:600 16px system-ui;color:#16243a;background:#ffffffe0;padding:10px 18px;border-radius:12px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"}}</script>
</head>
<body><div id="ui"></div><div id="load">Carregando personagem…</div><div id="hint">Arraste: girar · Roda/pinça: zoom</div>
<script type="module">
import * as THREE from 'three';
import {loadCharacter,PERSONAGENS,ANIMACOES} from './personagens.js?v=8';
const q=new URLSearchParams(location.search);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(2,devicePixelRatio));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#cfe3f2');
sc.add(new THREE.HemisphereLight('#ffffff','#8a9a80',1.15));
const sun=new THREE.DirectionalLight('#fff3dc',1.9);sun.position.set(2,4,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:.1,far:14});sc.add(sun);
const gr=new THREE.Mesh(new THREE.CircleGeometry(12,48),new THREE.MeshStandardMaterial({color:'#8fb37a',roughness:1}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;sc.add(gr);
const cam=new THREE.PerspectiveCamera(32,1,.02,80);
const st={who:q.get('p')||'female2',anim:q.get('a')||'parado',rot:q.get('rot')==='1',yaw:+(q.get('yaw')||.5),pitch:+(q.get('pitch')||.12),dist:+(q.get('d')||5.2),bones:q.get('bones')==='1'};
const cache={};let cur=null,helper=null;
const loadEl=document.getElementById('load');
async function pick(id){st.who=id;loadEl.style.display='block';loadEl.textContent='Carregando '+PERSONAGENS[id].nome+'…';ui();
 try{if(!cache[id])cache[id]=await loadCharacter(THREE,id);}catch(e){loadEl.textContent='Erro: '+e.message;console.error(e);return;}
 if(cur)sc.remove(cur.root);if(helper){sc.remove(helper);helper=null;}
 cur=cache[id];sc.add(cur.root);if(st.bones&&cur.skeletonRoot){helper=new THREE.SkeletonHelper(cur.skeletonRoot);sc.add(helper);}
 cur.play(st.anim);loadEl.style.display='none';ui();window.__cur=cur;}
function ui(){const u=document.getElementById('ui');u.innerHTML='';const mk=(t,on,fn)=>{const b=document.createElement('button');b.className='b'+(on?' on':'');b.textContent=t;b.onclick=fn;u.appendChild(b);};
 for(const id in PERSONAGENS)mk(PERSONAGENS[id].nome,st.who===id,()=>pick(id));
 mk(st.rot?'Girar: ligado':'Girar: desligado',st.rot,()=>{st.rot=!st.rot;ui();});
 mk('Esqueleto',st.bones,()=>{st.bones=!st.bones;pick(st.who);});
 const s=document.createElement('div');s.className='sep';u.appendChild(s);
 for(const a of ANIMACOES)mk(a.nome,st.anim===a.id,()=>{st.anim=a.id;if(cur)cur.play(a.id);ui();});}
ui();pick(st.who);
function size(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const el=r.domElement,P=new Map();
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});});
el.addEventListener('pointerup',e=>P.delete(e.pointerId));el.addEventListener('pointercancel',e=>P.delete(e.pointerId));
el.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(P.size===2){const a=[...P.values()],d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);p.x=e.clientX;p.y=e.clientY;const b=[...P.values()],d1=Math.hypot(b[0].x-b[1].x,b[0].y-b[1].y);st.dist=Math.max(.6,Math.min(20,st.dist*d0/Math.max(1,d1)));return;}
 p.x=e.clientX;p.y=e.clientY;st.yaw-=dx*.008;st.pitch=Math.max(-.2,Math.min(1.4,st.pitch+dy*.006));});
el.addEventListener('wheel',e=>{e.preventDefault();st.dist=Math.max(.6,Math.min(20,st.dist*Math.exp(e.deltaY*.001)));},{passive:false});
const clock=new THREE.Clock(),T0=q.get('t')!==null?+q.get('t'):null;
const SHEET=(q.get('sheet')||'').split(',').filter(Boolean).map(x=>x.split(':')),COLS=+(q.get('cols')||4);if(SHEET.length){document.getElementById('ui').style.display='none';document.getElementById('hint').style.display='none';}
(function loop(){requestAnimationFrame(loop);const dt=clock.getDelta();if(st.rot&&!P.size)st.yaw+=dt*.3;
 const ty=+(q.get('ty')||.85),cp=Math.cos(st.pitch);
 if(SHEET.length&&cur){const rows=Math.ceil(SHEET.length/COLS),w=innerWidth/COLS,h=innerHeight/rows;r.setScissorTest(true);cam.aspect=w/h;cam.updateProjectionMatrix();const d=st.dist;
  SHEET.forEach(([a,t,yw],i)=>{cur.play(a);cur.setTime(+t);const y=yw!==undefined?+yw:st.yaw,cx=i%COLS,cy=rows-1-Math.floor(i/COLS);r.setViewport(cx*w,cy*h,w,h);r.setScissor(cx*w,cy*h,w,h);cam.position.set(Math.sin(y)*cp*d,ty+Math.sin(st.pitch)*d,Math.cos(y)*cp*d);cam.lookAt(0,ty,0);r.render(sc,cam);});return;}
 if(cur){if(T0!==null)cur.setTime(T0);else cur.update(dt);}
 const d=st.dist/Math.min(1,cam.aspect*1.25);cam.position.set(Math.sin(st.yaw)*cp*d,ty+Math.sin(st.pitch)*d,Math.cos(st.yaw)*cp*d);cam.lookAt(0,ty,0);r.render(sc,cam);})();
</script></body></html>
