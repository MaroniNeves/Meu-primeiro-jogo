<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Prévia 3D dos pássaros</title>
<style>
html,body{margin:0;height:100%;background:#bfe0f2;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
#ui>*{pointer-events:auto}
.b{font:600 13px system-ui;border:1px solid #2a4a2a55;background:#ffffffd0;color:#173017;border-radius:999px;padding:6px 12px;cursor:pointer}
.b.on{background:#2f6a3a;color:#fff}
.sep{width:8px}
#hint{position:fixed;left:10px;bottom:10px;font:12px system-ui;color:#123;background:#ffffffb0;padding:4px 10px;border-radius:8px}
</style></head>
<body><div id="ui"></div><div id="hint">Arraste: girar · Roda/pinça: zoom · Botão direito: mover · Tamanho real (a mão tem 19 cm)</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="./passaros.js?v=25"></script>
<script>
const NAMES={periquito:'Periquito',pardal:'Pardal',gaio:'Gaio-azul',cardeal:'Cardeal'},SN={filhote:'Filhote',jovem:'Jovem',adulto:'Adulto'},MN={parado:'Parado',bicar:'Bicar',bater:'Bater asas',voar:'Voar',planar:'Planar',pousar:'Pousar'};
const q=new URLSearchParams(location.search);
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(Math.min(2,devicePixelRatio));r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color('#bfe0f2');
sc.add(new THREE.HemisphereLight('#eef6ff','#7a8a60',1.0));
const sun=new THREE.DirectionalLight('#fff3dc',2.2);sun.position.set(.4,.8,.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-.6,right:.6,top:.5,bottom:-.3,near:.1,far:3});sun.shadow.bias=-.0004;sc.add(sun);
const fill=new THREE.DirectionalLight('#cfe4ff',.6);fill.position.set(-.5,.2,-.4);sc.add(fill);
const gr=new THREE.Mesh(new THREE.CircleGeometry(6,48),new THREE.MeshStandardMaterial({color:'#6fa84e',roughness:1}));gr.rotation.x=-Math.PI/2;gr.position.y=-.2;gr.receiveShadow=true;sc.add(gr);
const cam=new THREE.PerspectiveCamera(30,1,.005,60);
const st={sp:q.get('s')||'periquito',stage:q.get('f')||'adulto',mode:q.get('a')||'planar',rot:q.get('rot')!=='0',yaw:+(q.get('yaw')||.6),pitch:+(q.get('pitch')||.3),dist:+(q.get('d')||0),tx:0,ty:.1,tz:0,freeze:q.get('t')!==null?+q.get('t'):null,
 L:{osso:q.get('osso')==='1',musculo:q.get('musculo')==='1',pele:q.get('pele')!=='0',penas:q.get('penas')!=='0'}};
let holder=new THREE.Group(),bird=null,T0=performance.now();sc.add(holder);
function build(){
 sc.remove(holder);holder=new THREE.Group();sc.add(holder);
 bird=window.arcanoBirds.make(st.sp,st.stage,{seed:3,camadas:st.L,poleiro:true});holder.add(bird);
 const fly=['voar','planar','pousar','bater'].includes(st.mode);
 if(bird.userData.perch)bird.userData.perch.visible=!(st.mode==='voar'||st.mode==='planar');
 st.dist=+q.get('d')||(fly?.8:.38);st.ty=fly?.15:.07;
 ui();
}
function ui(){const u=document.getElementById('ui');u.innerHTML='';
 const mk=(t,on,fn)=>{const b=document.createElement('button');b.className='b'+(on?' on':'');b.textContent=t;b.onclick=fn;u.appendChild(b);};
 for(const s of window.arcanoBirds.species)mk(NAMES[s],st.sp===s,()=>{st.sp=s;build();});
 const sp=document.createElement('div');sp.className='sep';u.appendChild(sp);
 for(const f of window.arcanoBirds.stages)mk(SN[f],st.stage===f,()=>{st.stage=f;build();});
 const sp2=document.createElement('div');sp2.className='sep';u.appendChild(sp2);
 for(const m of window.arcanoBirds.modes)mk(MN[m],st.mode===m,()=>{st.mode=m;T0=performance.now();build();});
 const sp3=document.createElement('div');sp3.className='sep';u.appendChild(sp3);
 for(const [k,n] of [['osso','Esqueleto'],['musculo','Músculos'],['pele','Pele'],['penas','Penas']])mk(n,st.L[k],()=>{st.L[k]=!st.L[k];bird.userData.api.setLayers(st.L);ui();});
 mk(st.rot?'Girar: ligado':'Girar: desligado',st.rot,()=>{st.rot=!st.rot;ui();});}
function size(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const el=r.domElement,P=new Map();
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});});
el.addEventListener('pointerup',e=>P.delete(e.pointerId));el.addEventListener('pointercancel',e=>P.delete(e.pointerId));
el.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(P.size===2){const a=[...P.values()],d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);p.x=e.clientX;p.y=e.clientY;const b=[...P.values()],d1=Math.hypot(b[0].x-b[1].x,b[0].y-b[1].y);st.dist=Math.max(.08,Math.min(5,st.dist*d0/Math.max(1,d1)));return;}
 p.x=e.clientX;p.y=e.clientY;
 if(p.b===2||e.shiftKey){const k=st.dist*.0016;st.tx-=dx*Math.cos(st.yaw)*k;st.tz+=dx*Math.sin(st.yaw)*k;st.ty=st.ty+dy*k;}
 else{st.yaw-=dx*.008;st.pitch=Math.max(-.3,Math.min(1.45,st.pitch+dy*.006));}});
el.addEventListener('wheel',e=>{e.preventDefault();st.dist=Math.max(.08,Math.min(5,st.dist*Math.exp(e.deltaY*.001)));},{passive:false});
el.addEventListener('contextmenu',e=>e.preventDefault());
let tl=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-tl)/1000);tl=now;if(st.rot&&!P.size)st.yaw+=dt*.3;
 const t=st.freeze!==null?st.freeze:(now-T0)/1000;
 if(bird){const api=bird.userData.api;api.animate(st.mode,t);
  // trajetória: voar/planar em círculo; pousar aproxima do poleiro; o resto fica parado
  if(st.mode==='voar'||st.mode==='planar'){const R=st.mode==='voar'?.22:.32,w=(st.mode==='voar'?.9:.6),a=t*w;bird.position.set(Math.sin(a)*R,.2+.02*Math.sin(t*1.7),Math.cos(a)*R-R);bird.rotation.set(0,a+Math.PI,0);bird.rotation.z=-.25;}
  else if(st.mode==='pousar'){const c=t%6,u=c<3.4?c/3.4:1,e=1-(1-u)*(1-u);bird.position.set(0,lerp(.28,0,e),lerp(-.7,0,e));bird.rotation.set(0,0,0);}
  else if(st.mode==='bater'){bird.position.set(0,.2,0);bird.rotation.set(0,0,0);}
  else{bird.position.set(0,0,0);bird.rotation.set(0,0,0);}
  if(st.mode==='planar'||st.mode==='voar'){st.tx=bird.position.x;st.tz=bird.position.z;}else{st.tx=0;st.tz=0;}}
 const cp=Math.cos(st.pitch);cam.position.set(st.tx+Math.sin(st.yaw)*cp*st.dist,st.ty+Math.sin(st.pitch)*st.dist,st.tz+Math.cos(st.yaw)*cp*st.dist);cam.lookAt(st.tx,st.ty,st.tz);r.render(sc,cam);})(tl);
function lerp(a,b,t){return a+(b-a)*t;}
build();
</script></body></html>
