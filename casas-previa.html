<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Casas pintadas</title>
<style>

<body><div id="ui"></div><div id="hint">Arraste: girar · Roda/pinça: zoom</div>

<script>
const q=new URLSearchParams(location.search),T=THREE;
const R=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.outputColorSpace=T.SRGBColorSpace;R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;document.body.appendChild(R.domElement);

const sun=new T.DirectionalLight('#fff0d0',.95);sun.position.set(-12,18,14);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-24,right:24,top:22,bottom:-16,near:1,far:80});sun.shadow.bias=-.0005;sun.shadow.normalBias=.04;sc.add(sun);
// céu
{const m=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;void main(){float h=normalize(p).y;vec3 c=mix(vec3(.84,.93,.98),vec3(.50,.76,.95),smoothstep(-.02,.2,h));c=mix(c,vec3(.22,.50,.86),smoothstep(.16,.7,h));gl_FragColor=vec4(c,1.);}'});
 sc.add(new T.Mesh(new T.SphereGeometry(700,24,12),m));
 const cl=document.createElement('canvas');cl.width=512;cl.height=256;const x=cl.getContext('2d');let s=4;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
 const B=[];for(let i=0;i<9;i++){const t=i/8,rad=26+Math.sin(Math.PI*t)*50*(.6+.5*r());B.push([70+t*372,196-rad*.7,rad]);}
 const d=(c,dx,dy,k)=>{x.fillStyle=c;for(const b of B){x.beginPath();x.arc(b[0]+dx,b[1]+dy,b[2]*k,0,7);x.fill();}};
 d('#a9bfe8',0,0,1);x.clearRect(0,198,512,60);x.globalCompositeOperation='source-atop';d('#cfdcf4',-4,-7,.95);d('#f4f7fd',-9,-14,.86);d('#fffaf0',-14,-22,.62);
 const ct=new T.CanvasTexture(cl);ct.colorSpace=T.SRGBColorSpace;
 for(const [px,py,pz,w] of [[-120,80,-260,220],[160,110,-300,260],[-300,120,-120,240],[300,90,-60,200]]){const sp=new T.Sprite(new T.SpriteMaterial({map:ct,fog:false,depthWrite:false}));sp.scale.set(w,w*.5,1);sp.position.set(px,py,pz);sc.add(sp);}}
const gm=new T.DataTexture(new Uint8Array([105,105,105,255,185,185,185,255,255,255,255,255]),3,1,T.RGBAFormat);gm.minFilter=gm.magFilter=T.NearestFilter;gm.needsUpdate=true;
// chão pintado
{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#55ae4c';g.fillRect(0,0,256,256);
 let s=3;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;const cols=['#35905a','#7dc84e','#acdc5e','#6cbc4c'];
 for(let i=0;i<260;i++){g.fillStyle=cols[i%4];g.globalAlpha=.55;const x=r()*256,y=r()*256;for(const ox of[0,-256,256])for(const oy of[0,-256,256]){g.beginPath();g.ellipse(x+ox,y+oy,10+r()*22,4+r()*8,-.5,0,7);g.fill();}}
 const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(36,36);
 const m=new T.Mesh(new T.PlaneGeometry(300,300),new T.MeshToonMaterial({map:t,gradientMap:gm}));m.rotation.x=-Math.PI/2;m.receiveShadow=true;sc.add(m);

 const pt=new T.CanvasTexture(pc);pt.colorSpace=T.SRGBColorSpace;pt.wrapS=pt.wrapT=T.RepeatWrapping;pt.repeat.set(2,14);
 const path=new T.Mesh(new T.PlaneGeometry(3.2,26),new T.MeshToonMaterial({map:pt,gradientMap:gm}));path.rotation.x=-Math.PI/2;path.position.set(0,.02,13+4);path.receiveShadow=true;sc.add(path);}
let grp=null;
function build(){if(grp)sc.remove(grp);grp=new T.Group();sc.add(grp);
 const st=state.style;const h=arcanoCasas.build({style:st,floors:st==='porto'?3:2,w:st==='porto'?10.5:9.5,d:6.6,tower:state.tower,seed:state.seed,leafShadow:false});grp.add(h);
 // árvores ao redor
 const tr=(type,x,z,hh,seed)=>{const t=arcanoTrees.make(type,{h:hh,seed,density:.4,shadows:true});t.position.set(x,0,z);grp.add(t);};
 tr('carvalho',-11,3,9,12);tr('betula',10.5,4,7,31);tr('cerejeira',13.5,-1,5.5,5);tr('bordo',-14,-7,6.5,8);
 // arbustos simples nas laterais
 const bm=new T.MeshToonMaterial({color:'#4c9a42',gradientMap:gm});for(const [x,z,s] of[[-6.5,3.8,1.1],[-5.2,4.2,.8],[6.2,3.9,1.0],[7.6,3.6,.9],[3.2,4.2,.7],[-3.4,4.4,.75]]){const m=new T.Mesh(new T.SphereGeometry(s,10,8),bm);m.scale.y=.7;m.position.set(x,s*.5,z);m.castShadow=m.receiveShadow=true;grp.add(m);}
}
const state={style:q.get('s')||'mond',tower:q.get('t')!=='0',seed:+(q.get('seed')||5)};
const st={yaw:+(q.get('yaw')||.45),pitch:+(q.get('pitch')||.17),dist:+(q.get('d')||22),tx:0,ty:3.8,tz:1};
function ui(){const u=document.getElementById('ui');u.innerHTML='';const mk=(t,on,fn)=>{const b=document.createElement('button');b.className='b'+(on?' on':'');b.textContent=t;b.onclick=fn;u.appendChild(b);};
 mk('Estilo Mondstadt',state.style==='mond',()=>{state.style='mond';build();ui();});mk('Estilo Porto',state.style==='porto',()=>{state.style='porto';build();ui();});
 mk(state.tower?'Torre: sim':'Torre: não',state.tower,()=>{state.tower=!state.tower;build();ui();});mk('Outra variação',false,()=>{state.seed=(state.seed*7+3)%997;build();});}
if(q.get('ui')!=='0')ui();else document.getElementById('hint').style.display='none';
build();
function size(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?64:42;cam.updateProjectionMatrix();}addEventListener('resize',size);size();
const el=R.domElement,P=new Map();
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});});
el.addEventListener('pointerup',e=>P.delete(e.pointerId));el.addEventListener('pointercancel',e=>P.delete(e.pointerId));
el.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(P.size===2){const a=[...P.values()],d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);p.x=e.clientX;p.y=e.clientY;const b=[...P.values()],d1=Math.hypot(b[0].x-b[1].x,b[0].y-b[1].y);st.dist=Math.max(4,Math.min(80,st.dist*d0/Math.max(1,d1)));return;}
 p.x=e.clientX;p.y=e.clientY;st.yaw-=dx*.006;st.pitch=Math.max(.0,Math.min(1.3,st.pitch+dy*.004));});
el.addEventListener('wheel',e=>{e.preventDefault();st.dist=Math.max(4,Math.min(80,st.dist*Math.exp(e.deltaY*.001)));},{passive:false});
function frame(){const cp=Math.cos(st.pitch);cam.position.set(st.tx+Math.sin(st.yaw)*cp*st.dist,Math.max(.8,st.ty+Math.sin(st.pitch)*st.dist),st.tz+Math.cos(st.yaw)*cp*st.dist);cam.lookAt(st.tx,st.ty,st.tz);R.render(sc,cam);}
(function loop(){requestAnimationFrame(loop);frame();})();
window.__shot=async(name,o)=>{o=o||{};if(o.style!==undefined||o.tower!==undefined||o.seed!==undefined){if(o.style)state.style=o.style;if(o.tower!==undefined)state.tower=o.tower;if(o.seed)state.seed=o.seed;build();}['yaw','pitch','dist','tx','ty','tz'].forEach(k=>{if(o[k]!==undefined)st[k]=o[k];});
